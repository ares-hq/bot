<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Rajdhani" font-weight="600">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B1E24"/><stop offset="1" stop-color="#141519"/></linearGradient></defs>
<rect x="0" y="0" width="1000" height="600" fill="url(#bg)"/>
<rect x="1" y="1" width="998" height="598" rx="15" fill="none" stroke="#2A2E36"/>
<text x="500" y="46" text-anchor="middle" font-weight="700" font-size="26" letter-spacing="4" fill="#EDEFF2">SIMULATED ALLIANCE</text>
<text x="500" y="74" text-anchor="middle" font-family="Roboto" font-weight="400" font-size="15" fill="#8A8F98">{{ subtitle_a }} &amp; {{ subtitle_b }}</text>
<line x1="60" y1="92" x2="940" y2="92" stroke="#282C34"/>
<rect x="60" y="120" width="880" height="96" rx="12" fill="#1E2127" stroke="#2E333C"/>
{% for h in headers %}<text x="{{ h.x }}" y="160" text-anchor="middle" font-weight="600" font-size="15" fill="#C9CCD2">{{ h.num }}</text>
<text x="{{ h.x }}" y="188" text-anchor="middle" font-family="Roboto" font-weight="400" font-size="17" fill="#EDEFF2">{{ h.name }}</text>
{% endfor %}<text x="500" y="160" text-anchor="middle" font-weight="500" font-size="13" letter-spacing="2" fill="#8A8F98">TEAM 1</text>
<text x="500" y="188" text-anchor="middle" font-weight="500" font-size="13" letter-spacing="2" fill="#8A8F98">TEAM 2</text>
{% for r in rows %}<text x="200" y="{{ r.y }}" text-anchor="middle" font-weight="700" font-size="20" fill="#EDEFF2">{{ r.t1 }}</text>
<text x="500" y="{{ r.y }}" text-anchor="middle" font-weight="600" font-size="15" letter-spacing="1.5" fill="#8B7BE8">{{ r.label }}</text>
<text x="800" y="{{ r.y }}" text-anchor="middle" font-weight="700" font-size="20" fill="#EDEFF2">{{ r.t2 }}</text>
{% endfor %}<line x1="60" y1="430" x2="940" y2="430" stroke="#282C34"/>
<text x="500" y="474" text-anchor="middle" font-size="15" letter-spacing="3" fill="#8A8F98">ALLIANCE ESTIMATED SCORE</text>
<text x="260" y="524" text-anchor="middle" font-weight="500" font-size="16" letter-spacing="1" fill="#B4B8C0">AUTO</text>
<text x="260" y="556" text-anchor="middle" font-weight="700" font-size="34" fill="#EDEFF2">{{ auto }}</text>
<text x="500" y="524" text-anchor="middle" font-weight="500" font-size="16" letter-spacing="1" fill="#B4B8C0">TELEOP</text>
<text x="500" y="556" text-anchor="middle" font-weight="700" font-size="34" fill="#EDEFF2">{{ teleop }}</text>
<text x="740" y="524" text-anchor="middle" font-weight="500" font-size="16" letter-spacing="1" fill="#B4B8C0">TOTAL</text>
<text x="740" y="556" text-anchor="middle" font-weight="700" font-size="34" fill="#8B7BE8">{{ total }}</text>
</svg>
